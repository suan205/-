<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 · 像素小屋</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="auth-page">
        <section class="pixel-card auth-card register-card">
            <h1 class="pixel-title">注册新账号</h1>

            <form class="auth-form" id="register-form" novalidate>
                <div class="field">
                    <label class="field-label" for="username">用户名</label>
                    <input
                        class="pixel-input"
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="3-12 位字母、数字或下划线"
                        maxlength="12">
                </div>

                <div class="field">
                    <label class="field-label" for="email">邮箱</label>
                    <input
                        class="pixel-input"
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="请输入邮箱地址"
                        maxlength="254">
                </div>

                <div class="field">
                    <label class="field-label" for="password">密码</label>
                    <input
                        class="pixel-input"
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="8-128位字母、数字或符号"
                        maxlength="128">
                    <button class="peek" id="peek" type="button">显示</button>
                </div>

                <div class="field">
                    <label class="field-label" for="confirm">确认密码</label>
                    <input
                        class="pixel-input"
                        id="confirm"
                        name="confirm"
                        type="password"
                        autocomplete="new-password"
                        placeholder="再输入一次密码"
                        maxlength="128">
                </div>

                <p class="form-tip" id="register-tip">注册成功会直接登录并进入个人主页。</p>

                <div class="auth-actions">
                    <button class="pixel-btn wide" id="register-btn" type="submit">注 册</button>
                </div>
            </form>

            <p class="auth-switch">
                已经有账号了？<a href="login.html">去登录</a>
            </p>
        </section>
    </main>

    <script type="module" src="js/register.js"></script>
</body>
</html>
